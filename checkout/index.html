<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <script type="module" crossorigin src="/Sleepoutside-team13/assets/checkout-D_KLHRz_.js"></script>
    <link rel="modulepreload" crossorigin href="/Sleepoutside-team13/assets/utils-BTTFrAus.js">
    <link rel="modulepreload" crossorigin href="/Sleepoutside-team13/assets/ExternalServices-5B962CgB.js">
    <link rel="stylesheet" crossorigin href="/Sleepoutside-team13/assets/utils-D3CRyxlY.css">
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form name="checkout" id="checkout-form" class="checkout-form">
          <fieldset>
            <legend>Shipping & Customer Info</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required />

            <label for="expiration">Expiration Date</label>
            <input type="text" id="expiration" name="expiration" placeholder="mm/yy" required />

            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required />
          </fieldset>

          <fieldset class="order-summary">
            <legend>Order Summary</legend>
            <div class="order-summary-row">
              <span>Item Subtotal (<span id="num-items">0</span> items):</span>
              <span id="subtotal">$0.00</span>
            </div>
            <div class="order-summary-row">
              <span>Shipping Estimate:</span>
              <span id="shipping">$0.00</span>
            </div>
            <div class="order-summary-row">
              <span>Tax (6%):</span>
              <span id="tax">$0.00</span>
            </div>
            <div class="order-summary-row">
              <span>Order Total:</span>
              <span id="orderTotal">$0.00</span>
            </div>
          </fieldset>

          <button type="submit" id="checkout-submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
